name: Bug report
description: Something isn't working with the Remote Desktop Commander service
labels: [bug]
body:
  - type: dropdown
    id: client
    attributes:
      label: AI client
      description: Which client were you connecting from?
      options:
        - claude.ai / Claude Desktop
        - Claude Code
        - ChatGPT
        - Cursor
        - VS Code
        - Gemini CLI
        - Other
    validations:
      required: true
  - type: dropdown
    id: device-os
    attributes:
      label: Device OS
      description: Operating system of the machine running the device agent
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you try, what did you expect, and what happened instead? Include any error messages from the client or the device agent terminal.
    validations:
      required: true
  - type: input
    id: agent-version
    attributes:
      label: Device agent version
      description: Version reported by get_config or the running agent startup output, if available. Write unknown if unavailable. npm view reports the registry version, not necessarily the running version. Share only the version, not the full configuration.
  - type: textarea
    id: tool-call-diagnostics
    attributes:
      label: Tool-call diagnostics (optional)
      description: Record the tool name, sanitized arguments, timestamp and timezone, exact client error, approval-card availability, and the last confirmed execution stage. Include a returned process PID and exit status when available. Write unknown for unobserved stages; a missing PID alone does not prove the service never received the request.
  - type: markdown
    attributes:
      value: |
        Please remove credentials, tokens, cookies, private key material, internal hosts/IPs,
        usernames, private paths, device identifiers, and unrelated activity from public reports.
        Do not attach a complete configuration or tool-history dump by default.
        See the [tool-call diagnostics guide](https://github.com/desktop-commander/remote-desktop-commander/blob/main/docs/TOOL_CALL_DIAGNOSTICS.md).
        Use the private reporting channel in SECURITY.md for security vulnerabilities.
